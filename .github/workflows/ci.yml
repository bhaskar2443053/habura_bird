name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  capturekit:
    # Platform-independent core of the iOS app; runs on Linux, so it's cheap.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios/Packages/CaptureKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  ios-app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: |
          xcodebuild build \
            -project HoubaraCapture.xcodeproj \
            -scheme HoubaraCapture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
